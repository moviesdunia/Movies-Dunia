<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --surface: #141414;
            --background: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.7);
        }

        body {
            background-color: var(--background);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .logo {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -1px;
        }

        /* Premium Hero Section */
        .hero {
            height: 80vh;
            background: linear-gradient(to right, var(--background) 10%, transparent 60%),
                        linear-gradient(to top, var(--background), transparent 40%),
                        url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2000') center/cover;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .hero-content { max-width: 600px; }
        .hero-content h1 { font-size: 4rem; margin: 0; line-height: 1; }
        .hero-content p { color: #aaa; font-size: 1.1rem; margin: 20px 0; }
        
        .btn-play {
            background: #fff;
            color: #000;
            padding: 12px 35px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-play:hover { background: rgba(255,255,255,0.8); }

        /* Smooth Card Grids */
        .row { padding: 40px 0 0 5%; }
        .row-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: #e5e5e5; }
        
        .movie-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 220px;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 30px;
            scrollbar-width: none;
        }

        .card {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .card:hover {
            transform: scale(1.08);
            z-index: 2;
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        .card:hover .card-overlay { opacity: 1; }
        
        .card-title { font-size: 0.9rem; font-weight: bold; }
        .badge { font-size: 0.7rem; background: var(--primary); padding: 2px 6px; border-radius: 3px; width: fit-content; margin-bottom: 5px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { height: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="/" class="logo">MOVIES DUNIA</a>
    <div style="display:flex; gap: 20px; align-items:center;">
        <input type="text" placeholder="Search movies..." style="background:rgba(255,255,255,0.1); border:1px solid #444; color:white; padding:5px 15px; border-radius:20px;">
        <a href="/admin.html" style="color:white; opacity:0.6; text-decoration:none; font-size:0.9rem;">Admin</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-content">
        <div class="badge">TRENDING NOW</div>
        <h1>Pushpa 2: The Rule</h1>
        <p>Witness the epic conclusion of the rise of Pushpa Raj. A global phenomenon arriving in May 2026.</p>
        <a href="#" class="btn-play">▶ Play Trailer</a>
    </div>
</section>

<div class="row">
    <div class="row-title">Recently Added</div>
    <div id="lib-list" class="movie-grid"></div>
</div>

<div class="row">
    <div class="row-title">Hollywood Blockbusters</div>
    <div id="hollywood-list" class="movie-grid"></div>
</div>

<div class="row" style="padding-bottom: 100px;">
    <div class="row-title">Desi Hits</div>
    <div id="desi-list" class="movie-grid"></div>
</div>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;">
    <button onclick="closeModal()" style="position:absolute; top:30px; right:40px; background:none; border:none; color:white; font-size:3rem; cursor:pointer;">&times;</button>
    <div id="videoContainer" style="width:90%; max-width:1000px;"></div>
</div>

<script>
    // Include the same init() and fetch functions from our previous conversation here
    // Use the new class names (.movie-grid instead of .movie-list)
    
    window.onscroll = function() {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) {
            nav.style.background = "rgba(10, 10, 10, 0.95)";
        } else {
            nav.style.background = "linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%)";
        }
    };
    
    // ... rest of the JS logic ...
</script>
</body>
</html>
