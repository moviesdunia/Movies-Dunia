<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium Streaming</title>
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; z-index: 1000; transition: 0.5s; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .logo { color: var(--primary); font-size: 1.8rem; font-weight: bold; text-decoration: none; }
        
        /* Hero Banner */
        .hero { height: 80vh; width: 100%; background: linear-gradient(to right, rgba(0,0,0,0.9), transparent), url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=1200') center/cover; display: flex; align-items: center; padding: 0 5%; box-sizing: border-box; }
        .hero-content { max-width: 600px; }
        .hero-content h1 { font-size: 3.5rem; margin: 0; }
        .hero-content p { font-size: 1.1rem; color: #ccc; }

        /* Movie Rows */
        .row { padding: 20px 0 20px 5%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
        .movie-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .movie-list::-webkit-scrollbar { display: none; }

        /* Advanced Card Design */
        .card { 
            min-width: 200px; height: 300px; background: var(--card-bg); 
            border-radius: 8px; overflow: hidden; position: relative; 
            transition: transform 0.3s ease; cursor: pointer;
        }
        .card:hover { transform: scale(1.08); z-index: 2; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { 
            position: absolute; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            width: 100%; padding: 15px; box-sizing: border-box; opacity: 0; transition: 0.3s;
        }
        .card:hover .card-info { opacity: 1; }
        .card-title { font-weight: bold; font-size: 0.9rem; }
        
        /* Footer */
        footer { padding: 40px; text-align: center; color: #555; border-top: 1px solid #222; }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="#" class="logo">MOVIES DUNIA</a>
    <div>
        <a href="/admin.html" style="color:white; text-decoration:none; font-size:0.9rem;">Admin</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-content">
        <h1 id="hero-title">Welcome Back</h1>
        <p id="hero-desc">Stream the latest blockbusters and exclusive content anywhere, anytime.</p>
        <button style="padding: 12px 30px; background: var(--primary); color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">▶ Watch Now</button>
    </div>
</section>

<div class="row">
    <div class="row-title">🔥 Trending Now</div>
    <div class="movie-list" id="trending-list">
        </div>
</div>

<div class="row">
    <div class="row-title">🎬 Action & Adventure</div>
    <div class="movie-list" id="action-list"></div>
</div>

<div class="row">
    <div class="row-title">👻 Horror & Thriller</div>
    <div class="movie-list" id="horror-list"></div>
</div>

<footer>
    &copy; 2026 Movies Dunia. Built with ❤️ for Cinema.
</footer>

<script>
    const API = "https://movies-dunia.onrender.com/api/movies";

    async function fetchMovies() {
        try {
            const res = await fetch(API);
            const movies = await res.json();
            
            if (movies.length > 0) {
                // Set the Hero Banner to the latest movie
                document.getElementById('hero-title').innerText = movies[0].title;
                document.getElementById('hero-desc').innerText = movies[0].overview || "Now Streaming";
            }

            renderMovies(movies);
        } catch (err) { console.error("Failed to load movies"); }
    }

    function renderMovies(movies) {
        const trending = document.getElementById('trending-list');
        const action = document.getElementById('action-list');
        const horror = document.getElementById('horror-list');

        movies.forEach(movie => {
            const card = `
                <div class="card" onclick="window.location.href='player.html?id=${movie._id}'">
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="card-info">
                        <div class="card-title">${movie.title}</div>
                        <div style="font-size:0.7rem; color:var(--primary);">${movie.category.toUpperCase()}</div>
                    </div>
                </div>
            `;

            // All movies go to Trending
            trending.innerHTML += card;

            // Separate by category
            if (movie.category === 'action') action.innerHTML += card;
            if (movie.category === 'horror') horror.innerHTML += card;
        });
    }

    // Change Nav background on scroll
    window.onscroll = function() {
        const nav = document.getElementById('navbar');
        if (window.pageYOffset > 50) nav.style.background = "#0a0a0a";
        else nav.style.background = "linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)";
    };

    fetchMovies();
</script>

</body>
</html>
