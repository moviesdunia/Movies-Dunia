<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium Streaming</title>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; overflow-x: hidden; }
        nav { padding: 20px 5%; display: flex; justify-content: space-between; background: linear-gradient(rgba(0,0,0,0.8), transparent); position: fixed; width: 100%; z-index: 100; box-sizing: border-box; }
        .hero { height: 50vh; background: linear-gradient(to right, #000, transparent), url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=1000') center/cover; display: flex; align-items: center; padding: 0 5%; }
        .row { padding: 20px 0 0 5%; }
        .row-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .movie-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .movie-list::-webkit-scrollbar { display: none; }
        .card { min-width: 160px; height: 240px; background: #1a1a1a; border-radius: 8px; cursor: pointer; transition: 0.4s; overflow: hidden; position: relative; }
        .card:hover { transform: scale(1.08); z-index: 5; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        #trailerModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center; }
        .card-title-overlay { position: absolute; bottom: 0; background: linear-gradient(transparent, black); width: 100%; padding: 10px; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="color:var(--red); font-weight:bold; text-decoration:none; font-size:1.8rem;">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; font-size:0.8rem; border:1px solid #444; padding:5px 12px; border-radius:4px;">Admin</a>
</nav>

<section class="hero">
    <div>
        <h1 style="font-size: 2.5rem; margin: 0;">Global Cinema</h1>
        <p style="color: #ccc;">Trailers for Hindi, Bengali, and English blockbusters.</p>
    </div>
</section>

<div class="row">
    <div class="row-title">🎬 Your Library</div>
    <div class="movie-list" id="trending"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 Upcoming Hindi</div>
    <div class="movie-list" id="hindi-upcoming"></div>
</div>

<div class="row">
    <div class="row-title">🇧🇩 Upcoming Bengali</div>
    <div class="movie-list" id="bengali-upcoming"></div>
</div>

<div class="row">
    <div class="row-title">🌎 Global Blockbusters</div>
    <div class="movie-list" id="english-upcoming"></div>
</div>

<div id="trailerModal">
    <button onclick="closeTrailer()" style="position:absolute; top:20px; right:30px; color:white; background:none; border:none; font-size:3rem; cursor:pointer;">×</button>
    <div id="videoContainer" style="width:85%; max-width:1000px; aspect-ratio:16/9;"></div>
</div>

<script>
    let TMDB_KEY = "";

    async function init() {
        try {
            const configRes = await fetch("/api/config/tmdb");
            const configData = await configRes.json();
            TMDB_KEY = configData.apiKey;

            // 1. Load Your Uploaded Movies
            const res = await fetch("/api/movies");
            const movies = await res.json();
            const trendDiv = document.getElementById('trending');
            movies.forEach(m => {
                trendDiv.innerHTML += `<div class="card" onclick="window.location.href='player.html?id=${m._id}'"><img src="${m.poster}"></div>`;
            });

            // 2. Load TMDB Rows
            if (TMDB_KEY) {
                // Fetch Hindi
                loadTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&region=IN&with_original_language=hi&sort_by=primary_release_date.desc`, 'hindi-upcoming');
                
                // Fetch Bengali
                loadTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=bn&sort_by=popularity.desc`, 'bengali-upcoming');
                
                // Fetch English (Global)
                loadTMDBRow(`https://api.themoviedb.org/3/movie/upcoming?api_key=${TMDB_KEY}&language=en-US`, 'english-upcoming');
            }
        } catch (err) { console.error("Init Error:", err); }
    }

    async function loadTMDBRow(url, elementId) {
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById(elementId);
        data.results.slice(0, 12).forEach(m => {
            if(m.poster_path) {
                container.innerHTML += `
                    <div class="card" onclick="playTrailer(${m.id})">
                        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                        <div class="card-title-overlay">${m.title}</div>
                    </div>`;
            }
        });
    }

    async function playTrailer(id) {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${TMDB_KEY}`);
        const data = await res.json();
        const video = data.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
        if(video) {
            document.getElementById('videoContainer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${video.key}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('trailerModal').style.display = 'flex';
        } else { alert("Trailer not found for this title."); }
    }

    function closeTrailer() { 
        document.getElementById('trailerModal').style.display = 'none'; 
        document.getElementById('videoContainer').innerHTML = ''; 
    }

    init();
</script>

</body>
</html>
