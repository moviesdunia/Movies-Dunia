<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium Streaming</title>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; overflow-x: hidden; }
        nav { padding: 20px 5%; display: flex; justify-content: space-between; background: linear-gradient(rgba(0,0,0,0.8), transparent); position: fixed; width: 100%; z-index: 100; box-sizing: border-box; }
        .hero { height: 45vh; background: linear-gradient(to right, #000, transparent), url('https://images.unsplash.com/photo-1478720568477-152d9b164e26?q=80&w=1000') center/cover; display: flex; align-items: center; padding: 0 5%; }
        .row { padding: 25px 0 0 5%; }
        .row-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .movie-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .movie-list::-webkit-scrollbar { display: none; }
        .card { min-width: 160px; height: 240px; background: #1a1a1a; border-radius: 8px; cursor: pointer; transition: 0.4s; overflow: hidden; position: relative; border: 1px solid #222; }
        .card:hover { transform: scale(1.08); z-index: 5; border-color: var(--red); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        #trailerModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center; }
        .card-title-overlay { position: absolute; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); width: 100%; padding: 15px 10px 10px; font-size: 0.75rem; text-align: left; box-sizing: border-box; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="color:var(--red); font-weight:bold; text-decoration:none; font-size:1.8rem; letter-spacing: 1px;">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; font-size:0.8rem; border:1px solid #444; padding:6px 15px; border-radius:4px; background: rgba(255,255,255,0.1);">Admin</a>
</nav>

<section class="hero">
    <div>
        <h1 style="font-size: 2.5rem; margin: 0;">Global Cinema</h1>
        <p style="color: #bbb; max-width: 500px;">Streaming the latest trailers and your uploaded favorites in one place.</p>
    </div>
</section>

<div class="row">
    <div class="row-title">🎬 Your Library</div>
    <div class="movie-list" id="trending"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 Upcoming Hindi</div>
    <div class="movie-list" id="hindi-upcoming"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 Upcoming Bengali</div>
    <div class="movie-list" id="bengali-upcoming"></div>
</div>

<div class="row">
    <div class="row-title">🌎 Global Blockbusters</div>
    <div class="movie-list" id="english-upcoming"></div>
</div>

<div id="trailerModal">
    <button onclick="closeTrailer()" style="position:absolute; top:20px; right:30px; color:white; background:none; border:none; font-size:3.5rem; cursor:pointer;">&times;</button>
    <div id="videoContainer" style="width:85%; max-width:1000px; aspect-ratio:16/9; box-shadow: 0 0 50px #000;"></div>
</div>

<script>
    let TMDB_KEY = "";

    async function init() {
        try {
            const configRes = await fetch("/api/config/tmdb");
            const configData = await configRes.json();
            TMDB_KEY = configData.apiKey;

            const res = await fetch("/api/movies");
            const movies = await res.json();
            const trendDiv = document.getElementById('trending');
            
            if(movies.length === 0) {
                trendDiv.innerHTML = "<p style='color:#555; margin-left:10px;'>Your library is currently empty. Upload via Admin.</p>";
            }

            movies.forEach(m => {
                trendDiv.innerHTML += `<div class="card" onclick="window.location.href='player.html?id=${m._id}'"><img src="${m.poster}"></div>`;
            });

            if (TMDB_KEY) {
                // Hindi
                loadTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&region=IN&with_original_language=hi&sort_by=primary_release_date.desc&primary_release_date.gte=2024-01-01`, 'hindi-upcoming');
                
                // Bengali
                loadTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=bn&sort_by=popularity.desc`, 'bengali-upcoming');
                
                // English
                loadTMDBRow(`https://api.themoviedb.org/3/movie/upcoming?api_key=${TMDB_KEY}&language=en-US`, 'english-upcoming');
            }
        } catch (err) { console.error("Init Error:", err); }
    }

    async function loadTMDBRow(url, elementId) {
        try {
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById(elementId);
            data.results.slice(0, 15).forEach(m => {
                if(m.poster_path) {
                    container.innerHTML += `
                        <div class="card" onclick="playTrailer(${m.id})">
                            <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}">
                            <div class="card-title-overlay">${m.title}</div>
                        </div>`;
                }
            });
        } catch(e) { console.error("Row Load Error", e); }
    }

    async function playTrailer(id) {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${TMDB_KEY}`);
        const data = await res.json();
        const video = data.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
        if(video) {
            document.getElementById('videoContainer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${video.key}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            document.getElementById('trailerModal').style.display = 'flex';
        } else { 
            alert("Official trailer is not yet available for this movie."); 
        }
    }

    function closeTrailer() { 
        document.getElementById('trailerModal').style.display = 'none'; 
        document.getElementById('videoContainer').innerHTML = ''; 
    }

    init();
</script>
</body>
</html>
