<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | 2026 Live Trailers</title>
    <style>
        :root { --red: #e50914; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; }
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: fixed; width: 100%; z-index: 1000; box-sizing: border-box; }
        .hero { height: 50vh; background: linear-gradient(to top, var(--bg), transparent), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200') center/cover; display: flex; align-items: flex-end; padding: 0 5% 40px; }
        .row { padding: 25px 0 0 5%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--red); padding-left: 15px; }
        .movie-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 25px; scrollbar-width: none; }
        .card { min-width: 180px; height: 270px; background: #111; border-radius: 10px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 0 20px var(--red); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-tag { position: absolute; top: 10px; right: 10px; background: var(--red); padding: 3px 8px; font-size: 0.6rem; border-radius: 3px; font-weight: bold; }
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999; align-items:center; justify-content:center; }
        iframe { width: 90%; max-width: 1200px; aspect-ratio: 16/9; border: none; box-shadow: 0 0 50px #000; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="color:var(--red); font-size:2rem; font-weight:bold; text-decoration:none;">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; opacity:0.6;">Admin</a>
</nav>

<section class="hero">
    <div>
        <h1 style="font-size:3.5rem; margin-bottom:0;">Live 2026 Trailers</h1>
        <p style="color:#aaa; font-size:1.2rem;">Powered by TMDB & YouTube Live Search</p>
    </div>
</section>

<div class="row">
    <div class="row-title">🎬 My Library</div>
    <div id="lib-list" class="movie-list"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 New Desi Series (2026)</div>
    <div id="desi-series" class="movie-list"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 Upcoming Desi Movies (May-June 2026)</div>
    <div id="desi-movies" class="movie-list"></div>
</div>

<div class="row">
    <div class="row-title">🌎 Global Future Hits</div>
    <div id="global-movies" class="movie-list"></div>
</div>

<div id="modal" onclick="this.style.display='none'; document.getElementById('player').src='';">
    <iframe id="player" src="" allow="autoplay; fullscreen"></iframe>
</div>

<script>
    let TMDB_KEY = "";
    let YT_KEY = "";
    const TODAY = "2026-05-11"; // Current date in May 2026

    async function init() {
        const config = await fetch("/api/config/tmdb").then(r => r.json());
        TMDB_KEY = config.apiKey;
        YT_KEY = config.youtubeKey;

        // 1. Load Personal Library
        const movies = await fetch("/api/movies").then(r => r.json());
        movies.forEach(m => {
            document.getElementById('lib-list').innerHTML += `
                <div class="card" onclick="window.location.href='player.html?id=${m._id}'">
                    <img src="${m.poster}">
                    <div class="card-tag">UPLOAD</div>
                </div>`;
        });

        // 2. Load Desi Series
        loadRow(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_original_language=hi|bn&first_air_date.gte=${TODAY}&sort_by=popularity.desc`, 'desi-series', 'tv');

        // 3. Load Desi Movies
        loadRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&region=IN&with_original_language=hi|bn&primary_release_date.gte=${TODAY}&sort_by=primary_release_date.asc`, 'desi-movies', 'movie');

        // 4. Load Global Hits
        loadRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&primary_release_date.gte=${TODAY}&sort_by=popularity.desc`, 'global-movies', 'movie');
    }

    async function loadRow(url, elementId, type) {
        const data = await fetch(url).then(r => r.json());
        const container = document.getElementById(elementId);
        
        for (let item of data.results.slice(0, 12)) {
            if (!item.poster_path) continue;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="card-tag">2026</div>`;
            card.onclick = () => getTrailer(item.name || item.title, item.id, type);
            container.appendChild(card);
        }
    }

    async function getTrailer(title, id, type) {
        let videoKey = "";

        // STEP 1: Try TMDB first
        try {
            const tmdbRes = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_KEY}`).then(r => r.json());
            const trailer = tmdbRes.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
            if (trailer) videoKey = trailer.key;
        } catch (e) { console.log("TMDB Video Error"); }

        // STEP 2: If no TMDB trailer, use your YouTube API Key!
        if (!videoKey && YT_KEY) {
            console.log(`Searching YouTube for: ${title} Official Trailer`);
            const ytRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(title + ' official trailer')}&key=${YT_KEY}&maxResults=1&type=video`).then(r => r.json());
            if (ytRes.items && ytRes.items.length > 0) videoKey = ytRes.items[0].id.videoId;
        }

        if (videoKey) {
            document.getElementById('player').src = `https://www.youtube.com/embed/${videoKey}?autoplay=1`;
            document.getElementById('modal').style.display = 'flex';
        } else {
            alert("Trailer not found yet for this upcoming title.");
        }
    }

    init();
</script>
</body>
</html>
