<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia</title>
    <style>
        body { background: #080808; color: white; font-family: sans-serif; margin: 0; }
        nav { padding: 20px 5%; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; }
        .row { padding: 20px 5%; }
        .grid { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; }
        .card { min-width: 160px; height: 240px; background: #111; border-radius: 8px; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; }
        iframe { width: 80%; aspect-ratio: 16/9; }
    </style>
</head>
<body>
    <nav><div style="color:#e50914; font-weight:bold; font-size:1.5rem;">MOVIES DUNIA</div></nav>
    <div class="row"><h3>My Library</h3><div id="lib-list" class="grid"></div></div>
    <div class="row"><h3>Hollywood Trailers</h3><div id="hollywood-list" class="grid"></div></div>
    <div class="row"><h3>Desi Trailers</h3><div id="desi-list" class="grid"></div></div>

    <div id="modal" onclick="closeM()"><div id="vContainer"></div></div>

    <script>
        let TMDB = "", YT = "";
        async function init() {
            const config = await fetch("/api/config/tmdb").then(r => r.json());
            TMDB = config.apiKey; YT = config.youtubeKey;
            
            // 1. My Library
            const myMovies = await fetch('/api/movies').then(r => r.json());
            myMovies.forEach(m => addCard(m.title, m.poster, 'lib-list', () => {
                if(m.videoUrl.includes('t.me')) window.open(m.videoUrl, '_blank');
                else window.location.href=`player.html?id=${m._id}`;
            }));

            // 2. TMDB Lists
            if(TMDB) {
                loadTMDB(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB}&with_original_language=en`, 'hollywood-list');
                loadTMDB(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB}&with_original_language=hi`, 'desi-list');
            }
        }

        async function loadTMDB(url, id) {
            const d = await fetch(url).then(r => r.json());
            d.results.forEach(m => addCard(m.title, `https://image.tmdb.org/t/p/w500${m.poster_path}`, id, () => playSmart(m.title, m.id)));
        }

        function addCard(t, p, id, fn) {
            const div = document.createElement('div');
            div.className = 'card'; div.onclick = fn;
            div.innerHTML = `<img src="${p}">`;
            document.getElementById(id).appendChild(div);
        }

        async function playSmart(t, id) {
            let key = "";
            const res = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${TMDB}`).then(r => r.json());
            const tr = res.results.find(v => v.site === 'YouTube');
            if(tr) key = tr.key;
            else if(YT) {
                const yRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${t} official trailer&key=${YT}&maxResults=1&type=video`).then(r => r.json());
                if(yRes.items.length) key = yRes.items[0].id.videoId;
            }
            if(key) {
                document.getElementById('vContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${key}?autoplay=1" allowfullscreen></iframe>`;
                document.getElementById('modal').style.display='flex';
            }
        }
        function closeM() { document.getElementById('modal').style.display='none'; document.getElementById('vContainer').innerHTML=''; }
        init();
    </script>
</body>
<
    /html>
