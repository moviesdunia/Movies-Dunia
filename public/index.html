<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --background: #080808;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Transparent Glass Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
            transition: 0.4s;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        nav.scrolled {
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -1px;
        }

        /* Cinematic Hero Section */
        .hero {
            height: 85vh;
            background: linear-gradient(to top, var(--background) 5%, transparent 40%),
                        linear-gradient(to right, var(--background) 10%, transparent 70%),
                        url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2000') center/cover;
            display: flex;
            align-items: center;
            padding: 0 5%;
            margin-bottom: -50px;
        }

        .hero-content { max-width: 650px; }
        .hero-content h1 { font-size: 4.5rem; margin: 0; font-weight: 800; line-height: 1.1; }
        .hero-content p { color: var(--text-dim); font-size: 1.2rem; margin: 20px 0 30px; line-height: 1.6; }
        
        .btn-main {
            background: white;
            color: black;
            padding: 14px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-main:hover { background: var(--primary); color: white; transform: scale(1.05); }

        /* Modern Movie Rows */
        .content-area { padding-bottom: 100px; }
        .row { padding: 40px 0 0 5%; }
        .row-title { 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin-bottom: 25px; 
            display: flex; 
            align-items: center;
            gap: 10px;
        }
        .row-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            display: block;
            border-radius: 4px;
        }

        .movie-grid {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 0 40px;
            scrollbar-width: none; /* Firefox */
        }

        .movie-grid::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .card {
            min-width: 200px;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: var(--card-bg);
            border: 1px solid #222;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(229, 9, 20, 0.4);
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0.8;
        }

        .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 5px; }
        .card-cat { color: var(--primary); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }

        /* Footer */
        footer { padding: 50px 5%; border-top: 1px solid #222; text-align: center; color: var(--text-dim); }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="/" class="logo">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; font-weight:600; font-size:0.9rem; border: 1px solid #444; padding: 8px 20px; border-radius: 30px;">Admin Panel</a>
</nav>

<section class="hero">
    <div class="hero-content">
        <h1>Pushpa 2: The Rule</h1>
        <p>The epic conclusion to the rise of Pushpa Raj. A cinematic phenomenon available exclusively in our library this 2026.</p>
        <a href="#lib" class="btn-main">▶ Start Watching</a>
    </div>
</section>

<div class="content-area" id="lib">
    </div>

<footer>
    <p>&copy; 2026 Movies Dunia. Created for Movie Lovers.</p>
</footer>

<script>
    // Navbar Scroll Effect
    window.onscroll = function() {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };

    async function loadWebsite() {
        const res = await fetch('/api/movies');
        const movies = await res.json();
        const contentArea = document.getElementById('content-area');

        // Grouping movies by category
        const categories = [...new Set(movies.map(m => m.category))];
        
        const container = document.getElementById('lib');
        container.innerHTML = '';

        categories.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'row';
            section.innerHTML = `
                <div class="row-title">${cat}</div>
                <div class="movie-grid" id="grid-${cat.replace(/\s+/g, '')}"></div>
            `;
            container.appendChild(section);

            const grid = document.getElementById(`grid-${cat.replace(/\s+/g, '')}`);
            movies.filter(m => m.category === cat).forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    if(movie.videoUrl.includes('t.me')) window.open(movie.videoUrl, '_blank');
                    else window.location.href = `player.html?id=${movie._id}`;
                };
                card.innerHTML = `
                    <img src="${movie.poster}">
                    <div class="card-overlay">
                        <div class="card-cat">${movie.category}</div>
                        <div class="card-title">${movie.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    }

    loadWebsite();
</script>
</body>
</html>
