<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --bg: #080808; --card-bg: #121212; }
        body { background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        
        /* Glass Navbar */
        nav { position: fixed; top:0; width:100%; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; transition: 0.4s; box-sizing: border-box; }
        nav.scrolled { background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #222; }
        .logo { color: var(--primary); font-size: 1.8rem; font-weight: 800; text-decoration: none; }

        /* Hero */
        .hero { height: 75vh; background: linear-gradient(to top, var(--bg), transparent 50%), linear-gradient(to right, var(--bg), transparent), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1500') center/cover; display: flex; align-items: center; padding: 0 5%; }
        .hero-text h1 { font-size: 4rem; margin: 0; }
        .btn-play { background: white; color: black; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 20px; display: inline-block; }

        /* Movie Rows */
        .row { padding: 40px 0 0 5%; }
        .row-title { font-size: 1.4rem; margin-bottom: 20px; font-weight: 700; border-left: 4px solid var(--primary); padding-left: 15px; }
        .movie-grid { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 30px; scrollbar-width: none; }
        .card { min-width: 200px; height: 300px; background: var(--card-bg); border-radius: 12px; overflow: hidden; position: relative; transition: 0.4s; cursor: pointer; border: 1px solid #222; }
        .card:hover { transform: translateY(-10px) scale(1.05); border-color: var(--primary); box-shadow: 0 10px 25px rgba(229,9,20,0.3); }
        .card img { width:100%; height:100%; object-fit: cover; }
        .card-info { position: absolute; bottom:0; width:100%; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .card-title { font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="/" class="logo">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; opacity:0.7;">Admin Portal</a>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1>Pushpa 2: The Rule</h1>
        <p style="max-width: 500px; color: #ccc;">The biggest Indian blockbuster of 2026. Watch the exclusive library on Movies Dunia.</p>
        <a href="#" class="btn-play">▶ Start Streaming</a>
    </div>
</section>

<div class="row">
    <div class="row-title">Your Private Library</div>
    <div id="lib-list" class="movie-grid"></div>
</div>

<div class="row" style="padding-bottom: 80px;">
    <div class="row-title">Hollywood blockbusters</div>
    <div id="hollywood-list" class="movie-grid"></div>
</div>

<script>
    window.onscroll = () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    };

    async function load() {
        const res = await fetch('/api/movies');
        const movies = await res.json();
        const list = document.getElementById('lib-list');
        movies.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                if(m.videoUrl.includes('t.me')) window.open(m.videoUrl, '_blank');
                else window.location.href = `player.html?id=${m._id}`;
            };
            card.innerHTML = `<img src="${m.poster}"><div class="card-info"><div class="card-title">${m.title}</div></div>`;
            list.appendChild(card);
        });
    }
    load();
</script>
</body>
</html>
