<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Dunia | Hybrid 2026</title>
    <style>
        :root { --red: #e50914; --bg: #050505; --gray: #111; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: fixed; width: 100%; z-index: 1000; box-sizing: border-box; }
        .hero { height: 40vh; background: linear-gradient(to top, var(--bg), transparent), url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=1200') center/cover; display: flex; align-items: flex-end; padding: 0 5% 40px; }
        .row { padding: 25px 0 0 5%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--red); padding-left: 15px; }
        .movie-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 25px; scrollbar-width: none; }
        .card { min-width: 180px; height: 270px; background: var(--gray); border-radius: 10px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; border: 1px solid #222; }
        .card:hover { transform: scale(1.05); border-color: var(--red); box-shadow: 0 0 20px rgba(229,9,20,0.4); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-tag { position: absolute; top: 10px; right: 10px; background: var(--red); padding: 3px 8px; font-size: 0.6rem; border-radius: 3px; font-weight: bold; text-transform: uppercase; }
        
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999; align-items:center; justify-content:center; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; background: none; border: none; }
        iframe { width: 90%; max-width: 1100px; aspect-ratio: 16/9; border: none; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="color:var(--red); font-size:2rem; font-weight:bold; text-decoration:none; letter-spacing:1px;">MOVIES DUNIA</a>
    <a href="/admin.html" style="color:white; text-decoration:none; opacity:0.6; font-size: 0.9rem; border: 1px solid #444; padding: 5px 15px; border-radius: 4px;">Admin</a>
</nav>

<section class="hero">
    <div><h1 style="font-size:3.5rem; margin:0; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Direct Desi & Global</h1></div>
</section>

<div class="row">
    <div class="row-title">🎬 My Library & Telegram</div>
    <div id="lib-list" class="movie-list"></div>
</div>

<div class="row">
    <div class="row-title">🌎 Hollywood Blockbusters (2026)</div>
    <div id="hollywood-list" class="movie-list"></div>
</div>

<div class="row">
    <div class="row-title">🇮🇳 Upcoming Indian Cinema</div>
    <div id="desi-list" class="movie-list"></div>
</div>

<div id="modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <div id="videoContainer" style="width:100%; display:flex; justify-content:center;"></div>
</div>

<script>
    let TMDB_KEY = "";
    let YT_KEY = "";
    const TODAY = "2026-05-11"; 

    async function init() {
        try {
            const config = await fetch("/api/config/tmdb").then(r => r.json());
            TMDB_KEY = config.apiKey;
            YT_KEY = config.youtubeKey;

            // 1. Load Personal Library (With Telegram Support)
            const movies = await fetch("/api/movies").then(r => r.json());
            const libList = document.getElementById('lib-list');
            
            movies.forEach(m => {
                const isTelegram = m.videoUrl.includes('t.me') || m.videoUrl.includes('telegram');
                const card = document.createElement('div');
                card.className = 'card';
                
                card.onclick = () => {
                    if (isTelegram) window.open(m.videoUrl, '_blank');
                    else window.location.href = `player.html?id=${m._id}`;
                };

                card.innerHTML = `
                    <img src="${m.poster}">
                    <div class="card-tag">${isTelegram ? 'Telegram' : 'Full Movie'}</div>
                    <div style="position:absolute; bottom:0; width:100%; padding:10px; background:linear-gradient(transparent, black); font-size:12px;">${m.title}</div>
                `;
                libList.appendChild(card);
            });

            if(TMDB_KEY) {
                // 2. Load Hollywood
                loadSection(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=en&primary_release_date.gte=${TODAY}&sort_by=popularity.desc`, 'hollywood-list');
                // 3. Load Desi
                loadSection(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=hi|bn&region=IN&primary_release_date.gte=${TODAY}&sort_by=popularity.desc`, 'desi-list');
            }
        } catch(e) { console.error("Init failed", e); }
    }

    async function loadSection(url, elementId) {
        const data = await fetch(url).then(r => r.json());
        const list = document.getElementById(elementId);
        for (let item of data.results.slice(0, 15)) {
            if(!item.poster_path) continue;
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => getTrailer(item.title, item.id);
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="card-tag">Trailer</div>`;
            list.appendChild(card);
        }
    }

    async function getTrailer(title, id) {
        let videoKey = "";
        const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${TMDB_KEY}`).then(r => r.json());
        const trailer = tmdbRes.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer');
        
        if (trailer) videoKey = trailer.key;
        else if (YT_KEY) {
            const ytRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(title + ' official trailer')}&key=${YT_KEY}&maxResults=1&type=video`).then(r => r.json());
            if (ytRes.items?.length > 0) videoKey = ytRes.items[0].id.videoId;
        }

        if (videoKey) {
            document.getElementById('videoContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoKey}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            document.getElementById('modal').style.display = 'flex';
        } else { alert("Trailer not found."); }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
    }

    init();
</script>
</body>
</html>
