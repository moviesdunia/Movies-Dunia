<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Player | Movies Dunia</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        video { width: 90%; max-width: 1000px; border-radius: 10px; background: #111; box-shadow: 0 0 30px rgba(229,9,20,0.3); }
        .info { width: 90%; max-width: 1000px; margin-top: 20px; }
        .back { color: #e50914; text-decoration: none; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>
    <div class="info">
        <a href="index.html" class="back">← Back to Home</a>
        <h1 id="m-title">Loading...</h1>
        <p id="m-desc"></p>
    </div>
    <video id="m-video" controls autoplay></video>

    <script>
        async function load() {
            const id = new URLSearchParams(window.location.search).get('id');
            const res = await fetch('/api/movies');
            const movies = await res.json();
            const movie = movies.find(m => m._id === id);
            
            if(movie) {
                document.getElementById('m-title').innerText = movie.title;
                document.getElementById('m-desc').innerText = movie.overview;
                document.getElementById('m-video').src = movie.videoUrl;
            } else {
                document.getElementById('m-title').innerText = "Video Not Found";
            }
        }
        load();
    </script>
</body>
</html
