<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Now | Movies Dunia</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        nav { position: absolute; top: 0; width: 100%; padding: 20px; background: linear-gradient(rgba(0,0,0,0.8), transparent); }
        .player-container { width: 90%; max-width: 1000px; aspect-ratio: 16/9; background: #111; }
        video { width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 0 30px rgba(229, 9, 20, 0.3); }
        .info { width: 90%; max-width: 1000px; margin-top: 20px; }
        .back-btn { color: #e50914; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<nav><a href="/" class="back-btn">← Back to Home</a></nav>

<div class="player-container">
    <video id="video-player" controls autoplay controlsList="nodownload"></video>
</div>

<div class="info">
    <h1 id="movie-title">Loading...</h1>
    <p id="movie-category" style="color: #888;"></p>
</div>

<script>
    async function loadMovie() {
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (!movieId) {
            window.location.href = '/';
            return;
        }

        try {
            // Fetch the movies from your library API
            const response = await fetch('/api/movies');
            const movies = await response.json();
            const movie = movies.find(m => m._id === movieId);

            if (movie) {
                document.title = movie.title + " | Movies Dunia";
                document.getElementById('movie-title').innerText = movie.title;
                document.getElementById('movie-category').innerText = "Category: " + (movie.category || "General");
                document.getElementById('video-player').src = movie.videoUrl;
            } else {
                alert("Movie not found in library.");
            }
        } catch (err) {
            console.error("Player Error:", err);
        }
    }

    loadMovie();
</script>
</body>
    
</html>
