<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Now | Movies Dunia</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 1000px; text-align: center; }
        video { width: 100%; border-radius: 8px; box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); background: #111; }
        h1 { color: #e50914; margin-bottom: 10px; font-size: 1.5rem; }
        p { color: #aaa; margin-bottom: 20px; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; margin-bottom: 20px; transition: 0.3s; }
        .back-btn:hover { background: #444; }
        #loading { font-size: 1.2rem; color: #e50914; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <div id="player-content">
        <div id="loading">Locating Video Stream...</div>
    </div>
</div>

<script>
    const API_BASE = "https://movies-dunia.onrender.com/api/movies";

    async function loadPlayer() {
        // 1. Get the Movie ID from the URL (e.g., player.html?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (!movieId) {
            document.getElementById('player-content').innerHTML = "<h2>No movie selected.</h2>";
            return;
        }

        try {
            // 2. Fetch all movies and find the one that matches our ID
            // (Note: In a bigger app we'd fetch just one, but this works perfectly for now)
            const res = await fetch(API_BASE);
            const movies = await res.json();
            const movie = movies.find(m => m._id === movieId);

            if (movie && movie.videoUrl) {
                document.title = `Watching ${movie.title} | Movies Dunia`;
                document.getElementById('player-content').innerHTML = `
                    <h1>${movie.title}</h1>
                    <p>${movie.overview || "No description available."}</p>
                    <video controls autoplay poster="${movie.poster}">
                        <source src="${movie.videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else {
                document.getElementById('player-content').innerHTML = "<h2>Video link not found in database.</h2>";
            }
        } catch (err) {
            document.getElementById('player-content').innerHTML = "<h2>Error connecting to server.</h2>";
        }
    }

    loadPlayer();
</script>

</body>
    
</html>
