<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream | Movies Dunia</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: #e50914; text-decoration: none; font-weight: bold; font-size: 1.1rem; z-index: 10; }
        .player-box { width: 95%; max-width: 1100px; aspect-ratio: 16/9; background: #0a0a0a; border: 1px solid #333; }
        video { width: 100%; height: 100%; }
        h1 { margin-top: 20px; font-size: 1.5rem; text-align: center; color: #ccc; }
    </style>
</head>
<body>

<a href="/" class="back-btn">← Back to Movies Dunia</a>

<div class="player-box">
    <video id="v-player" controls autoplay controlsList="nodownload"></video>
</div>
<h1 id="v-title">Loading Movie...</h1>

<script>
    async function load() {
        const id = new URLSearchParams(window.location.search).get('id');
        if(!id) return window.location.href = '/';

        const movies = await fetch('/api/movies').then(r => r.json());
        const movie = movies.find(m => m._id === id);

        if(movie) {
            document.getElementById('v-player').src = movie.videoUrl;
            document.getElementById('v-title').innerText = movie.title;
            document.title = movie.title + " | Watching Now";
        } else {
            alert("Movie not found.");
            window.location.href = '/';
        }
    }
    load();
</script>
</body>
</html>
