<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Manager | Admin</title>
    <style>
        :root { --red: #e50914; --dark: #141414; }
        body { background: #000; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .admin-card { background: var(--dark); padding: 25px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h2 { color: var(--red); text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--red); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b20710; }
        .footer-hint { font-size: 0.8rem; color: #666; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Movie Manager</h2>
    
    <div class="input-group">
        <label>Movie Title</label>
        <input type="text" id="title" placeholder="e.g. Pushpa 2">
    </div>

    <div class="input-group">
        <label>Poster Image URL</label>
        <input type="text" id="poster" placeholder="Paste link to image here">
    </div>

    <div class="input-group">
        <label>Video URL or Telegram Link</label>
        <input type="text" id="videoUrl" placeholder="Paste .mp4 or t.me link here">
    </div>

    <div class="input-group">
        <label>Category</label>
        <select id="category">
            <option value="Action">Action</option>
            <option value="Hollywood">Hollywood</option>
            <option value="Desi">Desi</option>
            <option value="Telegram Exclusive">Telegram Exclusive</option>
        </select>
    </div>

    <button onclick="addMovie()">Add to Website</button>

    <div class="footer-hint">
        Tip: Paste Telegram post links to open in the app automatically.
    </div>
</div>

<script>
    async function addMovie() {
        const title = document.getElementById('title').value;
        const poster = document.getElementById('poster').value;
        const videoUrl = document.getElementById('videoUrl').value;
        const category = document.getElementById('category').value;

        if(!title || !poster || !videoUrl) return alert("Please fill all fields!");

        const res = await fetch('/api/movies', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, poster, videoUrl, category })
        });

        if (res.ok) {
            alert("Success! Movie added.");
            window.location.href = "/";
        } else {
            alert("Error adding movie.");
        }
    }
</script>
