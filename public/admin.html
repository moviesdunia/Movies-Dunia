<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Movies Dunia</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        input, select { background: #222; color: white; border: 1px solid #333; }
        button { background: #e50914; color: white; font-weight: bold; cursor: pointer; }
        .movie-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add Movie</h2>
        <input type="password" id="pass" placeholder="Admin Password">
        <input type="text" id="title" placeholder="Title">
        <input type="text" id="url" placeholder="Video URL / Telegram Link">
        <label>Poster Image:</label>
        <input type="file" id="poster" accept="image/*">
        <select id="cat">
            <option value="Action">Action</option>
            <option value="Desi">Desi</option>
            <option value="Telegram">Telegram Exclusive</option>
        </select>
        <button onclick="add()">Add Movie</button>
        <hr>
        <h3>Manage Library</h3>
        <div id="list"></div>
    </div>

    <script>
        async function load() {
            const movies = await fetch('/api/movies').then(r => r.json());
            const list = document.getElementById('list');
            list.innerHTML = movies.map(m => `
                <div class="movie-row">
                    <span>${m.title}</span>
                    <button style="width:auto; padding:5px; background:#333;" onclick="del('${m._id}')">Delete</button>
                </div>
            `).join('');
        }

        async function add() {
            const fd = new FormData();
            fd.append('adminPassword', document.getElementById('pass').value);
            fd.append('title', document.getElementById('title').value);
            fd.append('videoUrl', document.getElementById('url').value);
            fd.append('category', document.getElementById('cat').value);
            fd.append('poster', document.getElementById('poster').files[0]);

            const res = await fetch('/api/movies', { method: 'POST', body: fd });
            if(res.ok) { alert("Added!"); load(); } else { alert("Failed! Check password."); }
        }

        async function del(id) {
            const adminPassword = document.getElementById('pass').value;
            if(!adminPassword) return alert("Enter password first");
            const res = await fetch(`/api/movies/${id}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ adminPassword })
            });
            if(res.ok) { alert("Deleted!"); load(); }
        }
        load();
    </script>
</body>
