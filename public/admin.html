<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
    .section { background: #111; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; border: 1px solid #222; }
    input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #333; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #e50914; border: none; color: #fff; cursor: pointer; font-weight: bold; }
    .movie-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
    .del-btn { background: #555; width: auto; padding: 5px 10px; font-size: 0.8rem; }
    h2 { color: #e50914; text-align: center; }
  </style>
</head>
<body>

<div class="section">
  <h2>Upload New Movie</h2>
  <input type="password" id="pass" placeholder="Admin Password">
  <input type="text" id="title" placeholder="Title">
  <select id="category">
    <option value="action">Action</option>
    <option value="horror">Horror</option>
    <option value="sci-fi">Sci-Fi</option>
  </select>
  <textarea id="overview" placeholder="Overview"></textarea>
  <label>Poster:</label><input type="file" id="poster">
  <label>Video:</label><input type="file" id="video">
  <button id="upBtn" onclick="upload()">Upload Movie</button>
</div>

<div class="section">
  <h2>Manage Movies</h2>
  <div id="movieList">Loading movies...</div>
</div>

<script>
  const API_BASE = "https://movies-dunia.onrender.com/api/movies";

  // Load movies for the delete list
  async function loadMovies() {
    const res = await fetch(API_BASE);
    const movies = await res.json();
    const list = document.getElementById("movieList");
    list.innerHTML = movies.map(m => `
      <div class="movie-item">
        <span>${m.title}</span>
        <button class="del-btn" onclick="deleteMovie('${m._id}')">Delete</button>
      </div>
    `).join('');
  }

  async function upload() {
    const btn = document.getElementById("upBtn");
    const formData = new FormData();
    formData.append("password", document.getElementById("pass").value);
    formData.append("title", document.getElementById("title").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("overview", document.getElementById("overview").value);
    formData.append("video", document.getElementById("video").files[0]);
    formData.append("poster", document.getElementById("poster").files[0]);

    btn.innerText = "Processing...";
    const res = await fetch(API_BASE + "/upload", { method: "POST", body: formData });
    const data = await res.json();
    
    if(res.ok) { alert("Uploaded!"); loadMovies(); } 
    else { alert("Error: " + data.error); }
    btn.innerText = "Upload Movie";
  }

  async function deleteMovie(id) {
    const password = document.getElementById("pass").value;
    if(!password) return alert("Enter password first!");
    if(!confirm("Delete this movie?")) return;

    const res = await fetch(`${API_BASE}/${id}`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });

    if(res.ok) { alert("Deleted!"); loadMovies(); }
    else { alert("Failed to delete."); }
  }

  loadMovies();
</script>
</body>
</html>
