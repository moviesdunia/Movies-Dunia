<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Upload Movie</title>
  <style>
    body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #111; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; border: 1px solid #222; }
    h2 { color: #e50914; text-align: center; margin-top: 0; }
    label { display: block; margin: 15px 0 5px; color: #aaa; font-size: 0.85rem; }
    input, select, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #e50914; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 1rem; }
    button:disabled { background: #555; }
    #status { text-align: center; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="box">
  <h2>Movies Dunia Admin</h2>
  
  <label>Movie Title</label>
  <input type="text" id="title" placeholder="e.g. Inception">

  <label>Category</label>
  <select id="category">
    <option value="action">Action</option>
    <option value="comedy">Comedy</option>
    <option value="drama">Drama</option>
    <option value="horror">Horror</option>
    <option value="sci-fi">Sci-Fi</option>
    <option value="thriller">Thriller</option>
  </select>

  <label>Overview</label>
  <textarea id="overview" rows="3" placeholder="Brief description..."></textarea>

  <label>Poster Image</label>
  <input type="file" id="poster" accept="image/*">

  <label>Video File</label>
  <input type="file" id="video" accept="video/*">

  <button id="upBtn" onclick="handleUpload()">Upload Movie</button>
  <div id="status"></div>
</div>

<script>
  // UPDATE THIS TO YOUR RENDER URL
  const API_URL = "https://movies-dunia.onrender.com/api/movies/upload";

  async function handleUpload() {
    const btn = document.getElementById("upBtn");
    const status = document.getElementById("status");
    
    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const overview = document.getElementById("overview").value;
    const videoFile = document.getElementById("video").files[0];
    const posterFile = document.getElementById("poster").files[0];

    if (!title || !videoFile) return alert("Title and Video are required!");

    const formData = new FormData();
    formData.append("title", title);
    formData.append("category", category);
    formData.append("overview", overview);
    formData.append("video", videoFile);
    if (posterFile) formData.append("poster", posterFile);

    try {
      btn.disabled = true;
      btn.innerText = "Processing...";
      status.innerText = "⏳ Uploading to Cloudinary... please wait.";
      status.style.color = "orange";

      const res = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      const result = await res.json();

      if (res.ok) {
        status.innerText = "✅ Movie uploaded successfully!";
        status.style.color = "lime";
        alert("Success!");
      } else {
        throw new Error(result.error || "Upload failed");
      }
    } catch (err) {
      status.innerText = "❌ Error: " + err.message;
      status.style.color = "red";
    } finally {
      btn.disabled = false;
      btn.innerText = "Upload Movie";
    }
  }
</script>

</body>
</html>
