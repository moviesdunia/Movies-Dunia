<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin Panel | Movies Dunia</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .box { background: #111; padding: 25px; border-radius: 12px; max-width: 500px; margin: 20px auto; border: 1px solid #222; }
        h2 { color: #e50914; text-align: center; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 12px; background: #222; color: #fff; border: 1px solid #333; box-sizing: border-box; border-radius: 6px; }
        button { width: 100%; padding: 14px; background: #e50914; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
        button:disabled { background: #555; }
        #progress { display:none; width: 100%; background: #333; margin-top: 15px; border-radius: 5px; overflow: hidden; }
        #bar { width: 0%; height: 8px; background: #e50914; transition: 0.3s; }
        .movie-row { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1a; margin-top: 5px; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Movie Manager</h2>
        <input type="password" id="pass" placeholder="Admin Password">
        <input type="text" id="title" placeholder="Movie Title">
        <textarea id="desc" rows="3" placeholder="Description"></textarea>
        <select id="cat"><option value="action">Action</option><option value="horror">Horror</option><option value="sci-fi">Sci-Fi</option></select>
        <label style="color:#888; font-size:0.8rem;">Poster Image:</label><input type="file" id="pos" accept="image/*">
        <label style="color:#888; font-size:0.8rem;">Video File:</label><input type="file" id="vid" accept="video/*">
        <button id="upBtn" onclick="upload()">Upload to Cloud</button>
        <div id="progress"><div id="bar"></div><div id="status" style="text-align:center; font-size:0.7rem; margin-top:5px;">Uploading...</div></div>
    </div>
    <div class="box">
        <h3>Current Library</h3>
        <div id="list">Loading...</div>
    </div>

<script>
    async function load() {
        const res = await fetch('/api/movies');
        const movies = await res.json();
        document.getElementById('list').innerHTML = movies.map(m => `
            <div class="movie-row">
                <span>${m.title}</span>
                <button onclick="del('${m._id}')" style="width:auto; padding:2px 8px; background:#444;">Delete</button>
            </div>`).join('');
    }

    async function upload() {
        const pass = document.getElementById('pass').value;
        const title = document.getElementById('title').value;
        const vid = document.getElementById('vid').files[0];
        if(!pass || !title || !vid) return alert("Fill required fields!");

        const fd = new FormData();
        fd.append("password", pass);
        fd.append("title", title);
        fd.append("overview", document.getElementById('desc').value);
        fd.append("category", document.getElementById('cat').value);
        fd.append("video", vid);
        fd.append("poster", document.getElementById('pos').files[0]);

        document.getElementById('progress').style.display = 'block';
        document.getElementById('bar').style.width = '30%';
        document.getElementById('upBtn').disabled = true;

        try {
            const res = await fetch('/api/movies/upload', { method: "POST", body: fd });
            if(res.ok) { 
                document.getElementById('bar').style.width = '100%';
                alert("Upload Successful!"); 
                location.reload(); 
            } else { alert("Failed: Check Password or File Size."); }
        } catch(e) { alert("Error uploading."); }
        document.getElementById('upBtn').disabled = false;
    }

    async function del(id) {
        const password = document.getElementById('pass').value;
        if(!password) return alert("Enter password!");
        if(!confirm("Delete?")) return;
        await fetch(`/api/movies/${id}`, { 
            method: "DELETE", 
            headers: {"Content-Type": "application/json"}, 
            body: JSON.stringify({ password }) 
        });
        load();
    }
    load();
</script>
</body>
<
    /html>
